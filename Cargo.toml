[package]
name = "nbs-cli"
version = "0.1.0"
authors = ["KNSN92"]
description = "A command-line interface for nbs files."
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
cpal = "0.17.3"
nbs-rust = { path = "./nbs-rust", features = ["audio", "midi"] }
rtrb = "0.3.4"
